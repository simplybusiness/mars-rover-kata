name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rubocop

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: RSpec
        run: bundle exec rspec
      - name: Minitest
        run: |
          if compgen -G "test/**/*_test.rb" > /dev/null; then
            bundle exec ruby -Ilib -Itest -e "Dir.glob('test/**/*_test.rb').sort.each { |f| require './' + f }"
          else
            echo "No minitest tests yet — skipping."
          fi
